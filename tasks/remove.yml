# =============================================================================
# Ansible Role: WireGuard - Tasks: Remove
# =============================================================================
# Stops and disables service, removes configuration, and optionally purges keys.
# =============================================================================
---
- name: WireGuard | remove | Stop and disable WireGuard service
  become: true
  ansible.builtin.systemd:
    name: "{{ __wireguard_service_name }}"
    state: stopped
    enabled: false
  failed_when: false
  when:
    - not ansible_check_mode

- name: WireGuard | remove | Remove WireGuard interface configuration
  become: true
  ansible.builtin.file:
    path: "{{ __wireguard_config_file }}"
    state: absent

- name: WireGuard | remove | Purge cryptographic key directory if requested
  become: true
  ansible.builtin.file:
    path: "{{ __wireguard_keys_dir }}"
    state: absent
  when: wireguard_purge_keys | bool
  no_log: true

- name: WireGuard | remove | Purge main WireGuard configuration directory if requested
  become: true
  ansible.builtin.file:
    path: "{{ __wireguard_config_dir }}"
    state: absent
  when: wireguard_purge_keys | bool

- name: WireGuard | remove | Stop and disable status snapshot systemd timer
  become: true
  ansible.builtin.systemd:
    name: "{{ __wireguard_status_unit_name }}.timer"
    state: stopped
    enabled: false
  failed_when: false
  when: not ansible_check_mode

- name: WireGuard | remove | Remove status snapshot systemd service and timer units
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ __wireguard_status_unit_name }}.service"
    - "/etc/systemd/system/{{ __wireguard_status_unit_name }}.timer"
  notify:
    - WireGuard | handlers | Reload systemd

- name: WireGuard | remove | Remove rsyslog logging configuration fragment
  become: true
  ansible.builtin.file:
    path: "/etc/rsyslog.d/{{ wireguard_rsyslog_config_file }}"
    state: absent
  notify:
    - WireGuard | handlers | Restart rsyslog

- name: WireGuard | remove | Remove logrotate configuration file
  become: true
  ansible.builtin.file:
    path: "/etc/logrotate.d/wireguard"
    state: absent

- name: WireGuard | remove | Check if dynamic debug control interface exists
  ansible.builtin.stat:
    path: "{{ __wireguard_dyndbg_control_file }}"
  register: __wireguard_remove_dyndbg_control_stat

- name: WireGuard | remove | Check if wireguard kernel module is loaded
  ansible.builtin.stat:
    path: "/sys/module/wireguard"
  register: __wireguard_remove_dyndbg_module_stat

# Justification: Disable runtime kernel dynamic debug for wireguard module before removing modprobe config file.
# Ensures debug messages stop streaming to kern.log immediately without requiring a module reload.
- name: WireGuard | remove | Disable runtime kernel dynamic debug for wireguard module
  become: true
  ansible.builtin.shell: "echo 'module wireguard -p' > {{ __wireguard_dyndbg_control_file }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - __wireguard_remove_dyndbg_control_stat.stat.exists | default(false)
    - __wireguard_remove_dyndbg_module_stat.stat.exists | default(false)

- name: WireGuard | remove | Remove modprobe dynamic debug configuration file
  become: true
  ansible.builtin.file:
    path: "{{ __wireguard_modprobe_config_file }}"
    state: absent

- name: WireGuard | remove | Purge log files and log archive directory if requested
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ wireguard_log_dir }}"
    - "{{ wireguard_logrotate_options.olddir }}"
  when: wireguard_purge_logs | bool

- name: WireGuard | remove | Remove APT packages (Debian)
  ansible.builtin.include_tasks: remove_debian.yml
  when:
    - ansible_facts['os_family'] == 'Debian'
    - wireguard_remove_packages | bool
