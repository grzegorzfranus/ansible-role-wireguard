# =============================================================================
# Ansible Role: WireGuard - Tasks: Assertions
# =============================================================================
# Basic type/choice validation is handled by meta/argument_specs.yml.
# This file performs runtime-only checks (regex patterns, subnet consistency, cross-host uniqueness).
# =============================================================================
---
# -----------------------------------------------------------------------------
# 1. Lifecycle Settings
# -----------------------------------------------------------------------------

- name: WireGuard | assert | Validate wireguard_state
  ansible.builtin.assert:
    that:
      - wireguard_state is defined
      - wireguard_state is string
      - wireguard_state | lower in ['present', 'absent']
    fail_msg: "wireguard_state must be 'present' or 'absent'"
    success_msg: "wireguard_state validated: {{ wireguard_state }}"

- name: WireGuard | assert | Validate wireguard_remove_packages
  ansible.builtin.assert:
    that:
      - wireguard_remove_packages is defined
      - wireguard_remove_packages is boolean
    fail_msg: "wireguard_remove_packages must be a boolean (true or false)"
    success_msg: "wireguard_remove_packages validated: {{ wireguard_remove_packages }}"

# -----------------------------------------------------------------------------
# 2. Network & Interface Settings
# -----------------------------------------------------------------------------

- name: WireGuard | assert | Validate wireguard_mesh_group
  ansible.builtin.assert:
    that:
      - wireguard_mesh_group is defined
      - wireguard_mesh_group is string
      - wireguard_mesh_group | length > 0
    fail_msg: "wireguard_mesh_group must be a non-empty string"
    success_msg: "wireguard_mesh_group validated: {{ wireguard_mesh_group }}"

- name: WireGuard | assert | Validate target host membership in mesh group
  ansible.builtin.assert:
    that:
      - groups[wireguard_mesh_group] is defined
      - groups[wireguard_mesh_group] | length > 0
      - inventory_hostname in groups[wireguard_mesh_group]
    fail_msg: >-
      Host '{{ inventory_hostname }}' is not a member of mesh group '{{ wireguard_mesh_group }}' or group is empty.
      The playbook MUST target the entire mesh group (e.g. hosts: {{ wireguard_mesh_group }}).
    success_msg: "Host '{{ inventory_hostname }}' is a valid member of mesh group '{{ wireguard_mesh_group }}'"
  when: wireguard_state | lower != 'absent'

- name: WireGuard | assert | Validate wireguard_interface
  ansible.builtin.assert:
    that:
      - wireguard_interface is defined
      - wireguard_interface is string
      - wireguard_interface is match('^[a-zA-Z0-9_-]+$')
    fail_msg: "wireguard_interface must be a valid interface name (e.g. 'wg0')"
    success_msg: "wireguard_interface validated: {{ wireguard_interface }}"

- name: WireGuard | assert | Validate wireguard_port
  ansible.builtin.assert:
    that:
      - wireguard_port is defined
      - wireguard_port | int >= 1
      - wireguard_port | int <= 65535
    fail_msg: "wireguard_port must be an integer between 1 and 65535"
    success_msg: "wireguard_port validated: {{ wireguard_port }}"

- name: WireGuard | assert | Validate wireguard_network
  ansible.builtin.assert:
    that:
      - wireguard_network is defined
      - wireguard_network is string
      - wireguard_network is match('^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$')
    fail_msg: "wireguard_network must be a valid CIDR string (e.g. '10.8.0.0/24')"
    success_msg: "wireguard_network validated: {{ wireguard_network }}"

- name: WireGuard | assert | Validate wireguard_address format and presence
  ansible.builtin.assert:
    that:
      - wireguard_address is defined
      - wireguard_address is string
      - wireguard_address | length > 0
      - wireguard_address is match('^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$')
    fail_msg: "wireguard_address must be defined per host as a valid CIDR string (e.g. '10.8.0.11/24')"
    success_msg: "wireguard_address validated for {{ inventory_hostname }}: {{ wireguard_address }}"
  when: wireguard_state | lower != 'absent'

- name: WireGuard | assert | Validate wireguard_address is inside wireguard_network
  vars:
    __addr_ip: "{{ wireguard_address.split('/')[0] }}"
    __addr_prefix: "{{ wireguard_address.split('/')[1] | int }}"
    __net_ip: "{{ wireguard_network.split('/')[0] }}"
    __net_prefix: "{{ wireguard_network.split('/')[1] | int }}"
    __addr_octets: "{{ __addr_ip.split('.') }}"
    __net_octets: "{{ __net_ip.split('.') }}"
    __addr_int: "{{ (__addr_octets[0] | int * 16777216) + (__addr_octets[1] | int * 65536) + (__addr_octets[2] | int * 256) + (__addr_octets[3] | int) }}"
    __net_int: "{{ (__net_octets[0] | int * 16777216) + (__net_octets[1] | int * 65536) + (__net_octets[2] | int * 256) + (__net_octets[3] | int) }}"
    __shift: "{{ 32 - (__net_prefix | int) }}"
    __is_inside: "{{ (__addr_prefix | int == __net_prefix | int) and ((__addr_int | int // (2 ** (__shift | int))) == (__net_int | int // (2 ** (__shift | int)))) }}"
  ansible.builtin.assert:
    that:
      - __is_inside | bool
    fail_msg: "wireguard_address ({{ wireguard_address }}) is not inside wireguard_network ({{ wireguard_network }})"
    success_msg: "wireguard_address {{ wireguard_address }} is inside subnet {{ wireguard_network }}"
  when: wireguard_state | lower != 'absent'

- name: WireGuard | assert | Validate wireguard_endpoint
  ansible.builtin.assert:
    that:
      - wireguard_endpoint is defined
      - wireguard_endpoint is string
      - wireguard_endpoint | length > 0
    fail_msg: "wireguard_endpoint must be a non-empty IP or FQDN string"
    success_msg: "wireguard_endpoint validated for {{ inventory_hostname }}: {{ wireguard_endpoint }}"
  when: wireguard_state | lower != 'absent'

- name: WireGuard | assert | Validate wireguard_mtu
  ansible.builtin.assert:
    that:
      - wireguard_mtu is none or (wireguard_mtu | int >= 1280 and wireguard_mtu | int <= 1500)
    fail_msg: "wireguard_mtu must be null (none) or an integer between 1280 and 1500"
    success_msg: "wireguard_mtu validated: {{ wireguard_mtu }}"

- name: WireGuard | assert | Validate wireguard_persistent_keepalive
  ansible.builtin.assert:
    that:
      - wireguard_persistent_keepalive is defined
      - wireguard_persistent_keepalive | int >= 0
    fail_msg: "wireguard_persistent_keepalive must be an integer >= 0"
    success_msg: "wireguard_persistent_keepalive validated: {{ wireguard_persistent_keepalive }}"

- name: WireGuard | assert | Validate wireguard_enable_forwarding
  ansible.builtin.assert:
    that:
      - wireguard_enable_forwarding is defined
      - wireguard_enable_forwarding is boolean
    fail_msg: "wireguard_enable_forwarding must be a boolean (true or false)"
    success_msg: "wireguard_enable_forwarding validated: {{ wireguard_enable_forwarding }}"

# -----------------------------------------------------------------------------
# 3. Key Management & Security Settings
# -----------------------------------------------------------------------------

- name: WireGuard | assert | Validate wireguard_use_preshared_keys
  ansible.builtin.assert:
    that:
      - wireguard_use_preshared_keys is defined
      - wireguard_use_preshared_keys is boolean
    fail_msg: "wireguard_use_preshared_keys must be a boolean (true or false)"
    success_msg: "wireguard_use_preshared_keys validated: {{ wireguard_use_preshared_keys }}"

- name: WireGuard | assert | Validate wireguard_regenerate_keys
  ansible.builtin.assert:
    that:
      - wireguard_regenerate_keys is defined
      - wireguard_regenerate_keys is boolean
    fail_msg: "wireguard_regenerate_keys must be a boolean (true or false)"
    success_msg: "wireguard_regenerate_keys validated: {{ wireguard_regenerate_keys }}"

- name: WireGuard | assert | Validate wireguard_purge_keys
  ansible.builtin.assert:
    that:
      - wireguard_purge_keys is defined
      - wireguard_purge_keys is boolean
    fail_msg: "wireguard_purge_keys must be a boolean (true or false)"
    success_msg: "wireguard_purge_keys validated: {{ wireguard_purge_keys }}"

# -----------------------------------------------------------------------------
# 4. Logging & Observability Settings
# -----------------------------------------------------------------------------

- name: WireGuard | assert | Validate wireguard_configure_logging
  ansible.builtin.assert:
    that:
      - wireguard_configure_logging is defined
      - wireguard_configure_logging is boolean
    fail_msg: "wireguard_configure_logging must be a boolean (true or false)"
    success_msg: "wireguard_configure_logging validated: {{ wireguard_configure_logging }}"

- name: WireGuard | assert | Validate wireguard_install_rsyslog
  ansible.builtin.assert:
    that:
      - wireguard_install_rsyslog is defined
      - wireguard_install_rsyslog is boolean
    fail_msg: "wireguard_install_rsyslog must be a boolean (true or false)"
    success_msg: "wireguard_install_rsyslog validated: {{ wireguard_install_rsyslog }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_log_dir
  ansible.builtin.assert:
    that:
      - wireguard_log_dir is defined
      - wireguard_log_dir is string
      - wireguard_log_dir | length > 0
      - wireguard_log_dir is match('^/')
    fail_msg: "wireguard_log_dir must be a non-empty absolute path starting with '/'"
    success_msg: "wireguard_log_dir validated: {{ wireguard_log_dir }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_log_file
  ansible.builtin.assert:
    that:
      - wireguard_log_file is defined
      - wireguard_log_file is string
      - wireguard_log_file | length > 0
      - wireguard_log_file is match('^/')
    fail_msg: "wireguard_log_file must be a non-empty absolute path starting with '/'"
    success_msg: "wireguard_log_file validated: {{ wireguard_log_file }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_log_dir_permissions
  ansible.builtin.assert:
    that:
      - wireguard_log_dir_permissions is defined
      - wireguard_log_dir_permissions is string
      - wireguard_log_dir_permissions is match('^0[0-7]{3}$')
    fail_msg: "wireguard_log_dir_permissions must be a valid 4-digit octal permission string (e.g. '0750')"
    success_msg: "wireguard_log_dir_permissions validated: {{ wireguard_log_dir_permissions }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_log_file_permissions
  ansible.builtin.assert:
    that:
      - wireguard_log_file_permissions is defined
      - wireguard_log_file_permissions is string
      - wireguard_log_file_permissions is match('^0[0-7]{3}$')
    fail_msg: "wireguard_log_file_permissions must be a valid 4-digit octal permission string (e.g. '0640')"
    success_msg: "wireguard_log_file_permissions validated: {{ wireguard_log_file_permissions }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_log_user
  ansible.builtin.assert:
    that:
      - wireguard_log_user is defined
      - wireguard_log_user is string
      - wireguard_log_user | length > 0
    fail_msg: "wireguard_log_user must be a non-empty string"
    success_msg: "wireguard_log_user validated: {{ wireguard_log_user }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_log_group
  ansible.builtin.assert:
    that:
      - wireguard_log_group is defined
      - wireguard_log_group is string
      - wireguard_log_group | length > 0
    fail_msg: "wireguard_log_group must be a non-empty string"
    success_msg: "wireguard_log_group validated: {{ wireguard_log_group }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_rsyslog_config_file
  ansible.builtin.assert:
    that:
      - wireguard_rsyslog_config_file is defined
      - wireguard_rsyslog_config_file is string
      - wireguard_rsyslog_config_file | length > 0
      - wireguard_rsyslog_config_file is match('^[a-zA-Z0-9_-]+\.conf$')
    fail_msg: "wireguard_rsyslog_config_file must be a valid filename ending with '.conf'"
    success_msg: "wireguard_rsyslog_config_file validated: {{ wireguard_rsyslog_config_file }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_enable_kernel_debug_logging
  ansible.builtin.assert:
    that:
      - wireguard_enable_kernel_debug_logging is defined
      - wireguard_enable_kernel_debug_logging is boolean
    fail_msg: "wireguard_enable_kernel_debug_logging must be a boolean (true or false)"
    success_msg: "wireguard_enable_kernel_debug_logging validated: {{ wireguard_enable_kernel_debug_logging }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_kernel_debug_persistent
  ansible.builtin.assert:
    that:
      - wireguard_kernel_debug_persistent is defined
      - wireguard_kernel_debug_persistent is boolean
    fail_msg: "wireguard_kernel_debug_persistent must be a boolean (true or false)"
    success_msg: "wireguard_kernel_debug_persistent validated: {{ wireguard_kernel_debug_persistent }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_enable_status_snapshot
  ansible.builtin.assert:
    that:
      - wireguard_enable_status_snapshot is defined
      - wireguard_enable_status_snapshot is boolean
    fail_msg: "wireguard_enable_status_snapshot must be a boolean (true or false)"
    success_msg: "wireguard_enable_status_snapshot validated: {{ wireguard_enable_status_snapshot }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_status_snapshot_file
  ansible.builtin.assert:
    that:
      - wireguard_status_snapshot_file is defined
      - wireguard_status_snapshot_file is string
      - wireguard_status_snapshot_file | length > 0
      - wireguard_status_snapshot_file is match('^/')
    fail_msg: "wireguard_status_snapshot_file must be a non-empty absolute path starting with '/'"
    success_msg: "wireguard_status_snapshot_file validated: {{ wireguard_status_snapshot_file }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_status_snapshot_interval
  ansible.builtin.assert:
    that:
      - wireguard_status_snapshot_interval is defined
      - wireguard_status_snapshot_interval is string
      - wireguard_status_snapshot_interval is match('^[0-9]+(s|sec|m|min|h|hour)$')
    fail_msg: "wireguard_status_snapshot_interval must be a systemd time span string (e.g. '5min', '1h')"
    success_msg: "wireguard_status_snapshot_interval validated: {{ wireguard_status_snapshot_interval }}"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_logrotate_options dictionary keys and values
  ansible.builtin.assert:
    that:
      - wireguard_logrotate_options is defined
      - wireguard_logrotate_options is mapping
      - wireguard_logrotate_options.enabled is defined
      - wireguard_logrotate_options.enabled is boolean
      - wireguard_logrotate_options.frequency is defined
      - wireguard_logrotate_options.frequency in ['hourly', 'daily', 'weekly', 'monthly']
      - wireguard_logrotate_options.rotate_count is defined
      - wireguard_logrotate_options.rotate_count | int >= 1
      - wireguard_logrotate_options.compress is defined
      - wireguard_logrotate_options.compress is boolean
      - wireguard_logrotate_options.notifempty is defined
      - wireguard_logrotate_options.notifempty is boolean
      - wireguard_logrotate_options.copytruncate is defined
      - wireguard_logrotate_options.copytruncate is boolean
      - wireguard_logrotate_options.dateext is defined
      - wireguard_logrotate_options.dateext is boolean
    fail_msg: "wireguard_logrotate_options must be a dictionary with valid keys (enabled, frequency, rotate_count, compress, notifempty, copytruncate, dateext)"
    success_msg: "wireguard_logrotate_options validated successfully"
  when: wireguard_configure_logging | bool

- name: WireGuard | assert | Validate wireguard_purge_logs
  ansible.builtin.assert:
    that:
      - wireguard_purge_logs is defined
      - wireguard_purge_logs is boolean
    fail_msg: "wireguard_purge_logs must be a boolean (true or false)"
    success_msg: "wireguard_purge_logs validated: {{ wireguard_purge_logs }}"
