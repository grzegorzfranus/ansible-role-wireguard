# =============================================================================
# Ansible Role: WireGuard - Argument Specifications
# =============================================================================
---
argument_specs:
  main:
    short_description: Deploy and configure WireGuard full-mesh VPN
    description:
      - Installs WireGuard via native APT package management on Ubuntu and Debian.
      - Builds a full-mesh WireGuard VPN topology across hosts in an inventory group.
      - Manages target host cryptographic keys securely with no_log protections.
      - Configures optional dedicated logging via rsyslog, kernel dynamic debug, logrotate, and systemd status snapshots.
    options:
      wireguard_state:
        description: Target lifecycle state of WireGuard installation
        type: str
        choices:
          - present
          - absent
        default: present

      wireguard_remove_packages:
        description: Uninstall WireGuard packages when wireguard_state is absent
        type: bool
        default: true

      wireguard_mesh_group:
        description: Inventory group name whose members form the WireGuard mesh network
        type: str
        default: wireguard

      wireguard_interface:
        description: Name of the WireGuard interface
        type: str
        default: wg0

      wireguard_port:
        description: UDP listening port for WireGuard service
        type: int
        default: 51820

      wireguard_network:
        description: WireGuard mesh network CIDR subnet
        type: str
        default: 10.8.0.0/24

      wireguard_address:
        description: Per-host IP address inside the WireGuard network (with prefix e.g. 10.8.0.11/24)
        type: str

      wireguard_endpoint:
        description: Public IP address or FQDN for peers to connect to this host
        type: str

      wireguard_mtu:
        description: Optional Maximum Transmission Unit (MTU) size for the WireGuard interface
        type: int

      wireguard_persistent_keepalive:
        description: Persistent keepalive interval in seconds (default 0 disables keepalive)
        type: int
        default: 0

      wireguard_use_preshared_keys:
        description: Enable unique per-peer-pair pre-shared keys (PSK)
        type: bool
        default: true

      wireguard_regenerate_keys:
        description: Force regeneration of private and public keys on target hosts
        type: bool
        default: false

      wireguard_purge_keys:
        description: Purge generated private/public keys and PSKs when wireguard_state is absent
        type: bool
        default: false

      wireguard_enable_forwarding:
        description: Enable IPv4 kernel packet forwarding via sysctl
        type: bool
        default: false

      wireguard_routed_networks:
        description: Additional CIDR networks this host routes for the mesh, appended by peers to its AllowedIPs
        type: list
        elements: str
        default: []

      wireguard_configure_logging:
        description: Master toggle to enable dedicated WireGuard logging with rsyslog and status snapshots
        type: bool
        default: false

      wireguard_install_rsyslog:
        description: Automatically install rsyslog and logrotate APT packages if missing
        type: bool
        default: true

      wireguard_log_dir:
        description: Base directory for WireGuard dedicated log files
        type: str
        default: "/var/log/wireguard"

      wireguard_log_file:
        description: Primary log file path for kernel dynamic debug and wg-quick messages
        type: str
        default: "/var/log/wireguard/wireguard.log"

      wireguard_log_dir_permissions:
        description: Directory octal permissions for wireguard_log_dir
        type: str
        default: "0750"

      wireguard_log_file_permissions:
        description: File octal permissions for WireGuard log files
        type: str
        default: "0640"

      wireguard_log_user:
        description: User owner for WireGuard log files and directory
        type: str
        default: "root"

      wireguard_log_group:
        description: Group owner for WireGuard log files and directory
        type: str
        default: "adm"

      wireguard_rsyslog_config_file:
        description: Filename for rsyslog configuration fragment in /etc/rsyslog.d/
        type: str
        default: "49-wireguard.conf"

      wireguard_enable_kernel_debug_logging:
        description: Enable kernel dynamic debug (dyndbg) logging for wireguard module
        type: bool
        default: true

      wireguard_kernel_debug_persistent:
        description: Persist kernel dynamic debug options across reboots via modprobe.d
        type: bool
        default: true

      wireguard_enable_status_snapshot:
        description: Enable periodic WireGuard status snapshot service and systemd timer
        type: bool
        default: true

      wireguard_status_snapshot_file:
        description: Log file path for periodic systemd WireGuard status snapshots
        type: str
        default: "/var/log/wireguard/wireguard-status.log"

      wireguard_status_snapshot_interval:
        description: Systemd timer execution interval for WireGuard status snapshots
        type: str
        default: "5min"

      wireguard_logrotate_options:
        description: Options dictionary for logrotate configuration
        type: dict
        options:
          enabled:
            description: Enable logrotate configuration for WireGuard logs
            type: bool
            default: true
          frequency:
            description: Log rotation frequency (hourly, daily, weekly, monthly)
            type: str
            default: "daily"
          rotate_count:
            description: Number of rotated log files to retain
            type: int
            default: 30
          compress:
            description: Compress rotated log files using gzip
            type: bool
            default: true
          notifempty:
            description: Do not rotate log file if it is empty
            type: bool
            default: true
          copytruncate:
            description: Truncate the original log file in place after creating a copy
            type: bool
            default: true
          dateext:
            description: Use date extension for rotated log files
            type: bool
            default: true
          dateformat:
            description: Date format string for dateext extension
            type: str
            default: "-%Y%m%d"
          olddir:
            description: Archive directory path to move rotated log files into
            type: str
            default: "/var/log/archive/wireguard"

      wireguard_purge_logs:
        description: Purge log files and log archive directory when wireguard_state is absent
        type: bool
        default: false
