# =============================================================================
# Ansible Role: WireGuard - Internal Variables
# =============================================================================
# Internal constants and computed values for the WireGuard role.
# These are NOT user-overridable. All use double-underscore prefix per Red Hat CoP.
# =============================================================================
---
# Directory path for WireGuard configuration files
__wireguard_config_dir: "/etc/wireguard"

# Directory path for storing host keys and per-pair pre-shared keys
__wireguard_keys_dir: "/etc/wireguard/keys"

# Full path to the WireGuard interface configuration file
__wireguard_config_file: "/etc/wireguard/{{ wireguard_interface }}.conf"

# Name of the systemd service unit for the WireGuard interface
__wireguard_service_name: "wg-quick@{{ wireguard_interface }}"

# File path for modprobe configuration options for WireGuard dynamic debug
__wireguard_modprobe_config_file: "/etc/modprobe.d/wireguard.conf"

# File path for kernel dynamic debug runtime control interface
__wireguard_dyndbg_control_file: "/proc/dynamic_debug/control"

# Name of the systemd unit for periodic WireGuard status snapshots
__wireguard_status_unit_name: "wireguard-status"

# Full path to the WireGuard CLI binary
__wireguard_wg_binary: "/usr/bin/wg"

# Full path to the systemctl command binary
__wireguard_systemctl_binary: "/usr/bin/systemctl"
